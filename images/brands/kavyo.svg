<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 46" width="144" height="46">
  <!-- KAVYO / KABYO SWITCHES Official Enhanced Vector Logo (Centered) -->
  <g id="kavyo-brand" transform="translate(1, 0)">
    <!-- Left Circular Yellow Emblem -->
    <g transform="translate(2, 3)">
      <!-- Outer Yellow Ring -->
      <circle cx="20" cy="20" r="18" fill="none" stroke="#f59e0b" stroke-width="3" />

      <!-- Geometric 'K' Structure inside ring -->
      <!-- Vertical Stem -->
      <polygon points="12,7 16.5,7 16.5,33 12,33" fill="#f59e0b" />
      <!-- Upper Diagonal Arm (Yellow) -->
      <polygon points="16.5,20 28,8 33,8 20.5,21.5" fill="#f59e0b" />
      <!-- Lower Diagonal Arm (Yellow) -->
      <polygon points="18.5,19 33,33 28,33 16.5,21.5" fill="#f59e0b" />
      <!-- Inner White/Blue Facet Accent -->
      <polygon points="16.5,10 24,18 20,21 16.5,17" fill="#0284c7" />
    </g>

    <!-- Main Title: KAVYO (Dual-Tone Blue & Golden Yellow) -->
    <!-- KA & V in Deep Slate/Navy -->
    <text x="47" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#0369a1" letter-spacing="0.2">KAV</text>

    <!-- YO in Golden Yellow -->
    <text x="95" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#f59e0b" letter-spacing="0.2">YO</text>

    <!-- Registered Symbol ® -->
    <circle cx="135.5" cy="11.5" r="2.5" fill="none" stroke="#0369a1" stroke-width="0.7" />
    <text x="135.5" y="13.2" font-family="Arial, sans-serif" font-size="3.5" font-weight="bold" fill="#0369a1" text-anchor="middle">R</text>

    <!-- Subtitle: SWITCHES -->
    <text x="48" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.2" font-weight="900" fill="#334155" letter-spacing="2.8">SWITCHES</text>
  </g>
</svg>
