<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 44" width="185" height="44">
  <!-- AROMA PLUS ELECTRIC SOLUTION Official Vector Logo -->
  <g id="aroma-plus-brand">
    <!-- Left Emblem: Charcoal 'A' with Red Lightning Bolt -->
    <g transform="translate(3, 3)">
      <!-- Left Stem of A (Charcoal) -->
      <polygon points="17,2 22,2 9,33 2,33" fill="#2d3748" />
      <!-- Right Stem of A (Charcoal) -->
      <polygon points="17,2 22,2 35,33 28,33" fill="#2d3748" />
      <!-- Red Electric Lightning Bolt slicing through A -->
      <polygon points="26,1 17,17 23,17 12,35 18,20 12,20" fill="#dc2626" />
    </g>

    <!-- Main Title: AROMA (Bold Red) -->
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#dc2626" letter-spacing="0.5">AROMA</text>

    <!-- PLUS (Condensed Red) -->
    <text x="141" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Narrow', sans-serif" font-size="16.5" font-weight="800" fill="#dc2626" letter-spacing="0.2">PLUS</text>

    <!-- Registered Mark ® -->
    <circle cx="178" cy="11.5" r="2.8" fill="none" stroke="#dc2626" stroke-width="0.8" />
    <text x="178" y="13.2" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" fill="#dc2626" text-anchor="middle">R</text>

    <!-- Subtitle: ELECTRIC SOLUTION -->
    <text x="45" y="36.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="800" fill="#dc2626" letter-spacing="2.2">ELECTRIC SOLUTION</text>
  </g>
</svg>
