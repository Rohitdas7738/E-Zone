<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 52" width="170" height="52">
  <!-- KINETO Official Enhanced Vector Logo -->
  <g id="kineto-brand">
    <!-- Left Ribbon 3D 'K' Emblem -->
    <g transform="translate(4, 3)">
      <!-- Black Back Upper Facet / Shadow Arm -->
      <polygon points="17,1 23,1 18,12 12,12" fill="#1e293b" />
      <!-- Black Lower Diagonal Leg -->
      <polygon points="28,2 38,2 20,28 12,28" fill="#111827" />

      <!-- Green Folded Ribbon Loop (Front) -->
      <!-- Top Left Ribbon Edge -->
      <polygon points="7,1 17,1 12,12 2,12" fill="#00b050" />
      <!-- Left Vertical Ribbon Spine -->
      <polygon points="2,12 12,12 2,28 0,28" fill="#16a34a" />
      <!-- Green Lower V-Hook / Checkmark -->
      <polygon points="2,28 12,28 34,2 42,2 18,34 6,34" fill="#00c853" />
    </g>

    <!-- Main Title: kineto (Bold Black Lowercase) -->
    <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#111827" letter-spacing="-0.5">kineto</text>

    <!-- TM Trademark Symbol -->
    <text x="127" y="16" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#111827">TM</text>

    <!-- Tagline: PLUG IN TO THE FUTURE -->
    <text x="51" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#334155" letter-spacing="1.5">PLUG IN TO THE FUTURE</text>
  </g>
</svg>
