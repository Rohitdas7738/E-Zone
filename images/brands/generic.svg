<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" width="160" height="42">
  <!-- GENERIC Official Enhanced Deep Glossy Black Vector Logo -->
  <defs>
    <!-- Deep Glossy Black Gradient with Highlight -->
    <linearGradient id="glossy-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter for Gloss Depth -->
    <filter id="gloss-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="generic-brand" filter="url(#gloss-shadow)">
    <!-- Main Typography: GENERIC in Deep Glossy Black -->
    <text x="80" y="27" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="url(#glossy-black)" text-anchor="middle" letter-spacing="2.5">GENERIC</text>

    <!-- Top Gloss Shine Arc/Line -->
    <path d="M 22,12 L 138,12" stroke="#ffffff" stroke-width="0.8" opacity="0.3" stroke-linecap="round" />
  </g>
</svg>
