<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" width="200" height="70">
  <!-- PREETI PLAST Official Enhanced Vector Logo -->
  <defs>
    <!-- Metallic Chrome Badge Gradient -->
    <linearGradient id="chrome-oval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <g id="preeti-plast-brand">
    <!-- Top Chrome SVSH Oval Emblem -->
    <g transform="translate(100, 11)">
      <!-- Outer Chrome Bezel -->
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="url(#chrome-oval)" stroke="#64748b" stroke-width="0.8" />
      <!-- Inner Silver Recessed Plate -->
      <ellipse cx="0" cy="0" rx="20" ry="6.8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5" />
      <!-- SVSH Red Letters -->
      <text x="0" y="3.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.8" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1.2">SVSH</text>
    </g>

    <!-- PREETI PLAST Bold Red Chiseled Typography -->
    <g transform="translate(100, 39)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="22.5" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1.2">PREETI PLAST</text>

      <!-- Registered Trademark ® Symbol -->
      <circle cx="83" cy="-14" r="2.8" fill="none" stroke="#1e293b" stroke-width="0.8" />
      <text x="83" y="-12.3" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" fill="#1e293b" text-anchor="middle">R</text>
    </g>

    <!-- Slogan: Quality... Value... Innovation (Elegant Italic Script) -->
    <text x="100" y="58" font-family="'Brush Script MT', 'Lucida Calligraphy', 'Segoe Script', 'Dancing Script', cursive, sans-serif" font-size="13" font-style="italic" font-weight="bold" fill="#334155" text-anchor="middle" letter-spacing="0.5">Quality... Value... Innovation</text>
  </g>
</svg>
