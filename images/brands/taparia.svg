<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 60" width="130" height="60">
  <!-- TAPARIA Official Enhanced Vector Logo -->
  <g id="taparia-logo">
    <!-- Top Narrow Blue Stripes (4 stripes) -->
    <g fill="#006ec7">
      <rect x="42" y="2" width="46" height="2.2" rx="0.6" />
      <rect x="42" y="5.8" width="46" height="2.2" rx="0.6" />
      <rect x="42" y="9.6" width="46" height="2.2" rx="0.6" />
      <rect x="42" y="13.4" width="46" height="2.2" rx="0.6" />
    </g>

    <!-- Upper Wide Blue Stripes (3 stripes) -->
    <g fill="#006ec7">
      <rect x="6" y="17.2" width="118" height="2.2" rx="0.6" />
      <rect x="6" y="21" width="118" height="2.2" rx="0.6" />
      <rect x="6" y="24.8" width="118" height="2.2" rx="0.6" />
    </g>

    <!-- Center White Background backing for clean readability -->
    <rect x="4" y="27" width="122" height="15" fill="#ffffff" opacity="0.95" />

    <!-- TAPARIA Bold Red Text -->
    <text x="65" y="39.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="18.5" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="0.5">TAPARIA</text>

    <!-- Lower Wide Blue Stripes (3 stripes) -->
    <g fill="#006ec7">
      <rect x="6" y="42" width="118" height="2.2" rx="0.6" />
      <rect x="6" y="45.8" width="118" height="2.2" rx="0.6" />
      <rect x="6" y="49.6" width="118" height="2.2" rx="0.6" />
    </g>

    <!-- Bottom Narrow Blue Stripes (4 stripes) -->
    <g fill="#006ec7">
      <rect x="42" y="53.4" width="46" height="2.2" rx="0.6" />
      <rect x="42" y="57.2" width="46" height="2.2" rx="0.6" />
    </g>
  </g>
</svg>
