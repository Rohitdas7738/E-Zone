<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 44" width="152" height="44">
  <!-- STURLITE X / STARLIGHTX Official Enhanced Vector Logo (Tight Spacing) -->
  <g id="sturlite-x-brand">
    <!-- 'Sturlite' Bold Modern Typography -->
    <text x="3" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="24.5" font-weight="900" fill="#111827" letter-spacing="-0.3">Sturlite</text>

    <!-- Iconic Chevron Geometric 'X' Tightly Spaced Next to 'e' -->
    <g transform="translate(94, 4)" fill="#111827">
      <!-- Diagonal Main Slash (\) -->
      <polygon points="4,2 18,2 48,34 34,34" />

      <!-- Diagonal Slash (/) with Chevron Block Ends -->
      <polygon points="34,2 54,2 54,12 40,12" />
      <polygon points="4,34 18,34 32,20 18,20" />
      <polygon points="32,20 40,12 54,26 54,34 40,34" />
    </g>

    <!-- Registered Symbol ® -->
    <circle cx="147" cy="9.5" r="2.8" fill="none" stroke="#111827" stroke-width="0.8" />
    <text x="147" y="11.2" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" fill="#111827" text-anchor="middle">R</text>
  </g>
</svg>
