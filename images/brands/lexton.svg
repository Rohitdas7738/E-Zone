<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 48" width="190" height="48">
  <!-- LEXTON Official Enhanced Vector Logo -->
  <defs>
    <!-- Left red box clip path following the diagonal of X -->
    <clipPath id="red-box-clip">
      <polygon points="4,6 71,6 84,22.5 79,30 99,42 4,42" />
    </clipPath>
  </defs>

  <!-- Red Shape on Left -->
  <polygon points="4,6 71,6 84,22.5 79,30 99,42 4,42" fill="#ff0000" />

  <!-- L (White) -->
  <path d="M 15,12 L 22.5,12 L 22.5,30 L 34,30 L 34,36 L 15,36 Z" fill="#ffffff" />

  <!-- E (White) -->
  <path d="M 38,12 L 54,12 L 54,17.5 L 45.5,17.5 L 45.5,21 L 53,21 L 53,26.5 L 45.5,26.5 L 45.5,30.5 L 54.5,30.5 L 54.5,36 L 38,36 Z" fill="#ffffff" />

  <!-- Base Layer: X, T, O, N in Vibrant Red -->
  <g fill="#ff0000">
    <!-- Full X -->
    <path d="M 58,12 L 65.5,12 L 75.5,24 L 85.5,12 L 93,12 L 80.5,26.5 L 94,36 L 86.5,36 L 75.5,27 L 64.5,36 L 57,36 L 70.5,24 Z" />

    <!-- T -->
    <path d="M 98,12 L 120,12 L 120,17.5 L 113,17.5 L 113,36 L 105,36 L 105,17.5 L 98,17.5 Z" />

    <!-- O -->
    <path d="M 136,11.5 C 127.5,11.5 122,16.5 122,24 C 122,31.5 127.5,36.5 136,36.5 C 144.5,36.5 150,31.5 150,24 C 150,16.5 144.5,11.5 136,11.5 Z M 136,17.2 C 140.2,17.2 142.5,20 142.5,24 C 142.5,28 140.2,30.8 136,30.8 C 131.8,30.8 129.5,28 129.5,24 C 129.5,20 131.8,17.2 136,17.2 Z" />

    <!-- N -->
    <path d="M 155,12 L 162.5,12 L 174,27.5 L 174,12 L 181.5,12 L 181.5,36 L 174,36 L 162.5,20.5 L 162.5,36 L 155,36 Z" />

    <!-- Registered Mark ® -->
    <circle cx="186.5" cy="11.5" r="3.5" fill="none" stroke="#ff0000" stroke-width="0.9" />
    <text x="186.5" y="13.2" font-family="Arial, sans-serif" font-size="4" font-weight="900" fill="#ff0000" text-anchor="middle">R</text>
  </g>

  <!-- Overlay: White section of X clipped by the left red box -->
  <g clip-path="url(#red-box-clip)">
    <path d="M 58,12 L 65.5,12 L 75.5,24 L 85.5,12 L 93,12 L 80.5,26.5 L 94,36 L 86.5,36 L 75.5,27 L 64.5,36 L 57,36 L 70.5,24 Z" fill="#ffffff" />
  </g>
</svg>
