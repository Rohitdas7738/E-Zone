<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 102 34" width="102" height="34">
  <!-- Star Flowrus Centered & Large Official Vector Logo -->
  <g id="star-flowrus-brand">
    <!-- Stylized Red Star on Left -->
    <g transform="translate(1, 1)">
      <!-- Main Star Body -->
      <polygon points="15,2 18.8,11.2 28.5,11.6 21,17 23.9,26.5 15,20.8 6.1,26.5 9,17 1.5,11.6 11.2,11.2" fill="#e50914" />
      <!-- Star Inner Cutout -->
      <polygon points="15,7 17.5,13 23.5,13.3 19,16.8 20.6,22.8 15,19.2 9.4,22.8 11,16.8 6.5,13.3 12.5,13" fill="#ffffff" />
      <!-- Speed Swooshes on Star -->
      <path d="M 16,11.5 C 23,10 32,9 37,11 C 31,12.5 23,14 18,15.5 Z" fill="#e50914" />
      <path d="M 10,21 C 18,16 30,13.5 35,14.5 C 28,16 20,19.5 12,23 Z" fill="#e50914" />
    </g>

    <!-- 'Star' Speed Bold Italic Typography -->
    <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Impact', sans-serif" font-size="21" font-weight="900" font-style="italic" fill="#0f172a" letter-spacing="-0.5">Star</text>

    <!-- 'flowrus' Subtitle Bold Italic -->
    <text x="37" y="31.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" font-style="italic" fill="#0f172a" letter-spacing="0.8">flowrus</text>

    <!-- Registered Trademark ® Symbol -->
    <circle cx="89" cy="9" r="2.8" fill="none" stroke="#0f172a" stroke-width="0.8" />
    <text x="89" y="10.8" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>
  </g>
</svg>
